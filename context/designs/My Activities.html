  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"5e3f66f0-0767-4c41-8adc-c92453dd8c0d\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =====================================================================\n   NILE DESIGN SYSTEM — colors_and_type.css\n   Source of truth: \"Nile Brand Visual Identity Guidelines v1.0, Feb 2026\"\n   (official) + Brand Colours 2026 PPTX theme. Load this file first.\n\n   TYPOGRAPHY (official): Inter is the PRIMARY brand typeface for all digital\n   & print communications — Regular (body), Semibold (headlines/subheads),\n   Bold (CTA text). Arial is used ONLY for editable docs (PowerPoint, Word).\n   Do not substitute or mix additional typefaces. Inter (full Latin set) is\n   hosted locally in /fonts as woff2 — no external/CDN web fonts.\n   ===================================================================== */\n\n/* Inter — self-hosted (SIL Open Font License). Paths resolve from this file (root). */\n@font-face { font-family:'Inter'; font-style:normal; font-weight:400; font-display:swap; src:url(\"ce3db452-1a45-4311-8aee-bc7500dc9efc\") format('woff2'); }\n@font-face { font-family:'Inter'; font-style:normal; font-weight:500; font-display:swap; src:url(\"33636263-374c-4cab-8e7e-9facf2fe3fba\") format('woff2'); }\n@font-face { font-family:'Inter'; font-style:normal; font-weight:600; font-display:swap; src:url(\"cd54600a-8769-4eae-b22f-43d2e0217208\") format('woff2'); }\n@font-face { font-family:'Inter'; font-style:normal; font-weight:700; font-display:swap; src:url(\"211be8ed-3f38-4d10-819b-ba9de19eef19\") format('woff2'); }\n@font-face { font-family:'Inter'; font-style:italic; font-weight:400; font-display:swap; src:url(\"48847d95-02e4-46cf-a1da-be3deaf7c386\") format('woff2'); }\n\n:root {\n  /* ---------------------------------------------------------------\n     PRIMARY COLORS  (dominant — foundation of the identity)\n     --------------------------------------------------------------- */\n  --nile-blue:        #0E4EAF; /* Nile Blue — primary brand color   PMS 2388 C */\n  --deep-nile-blue:   #072F68; /* Deep Nile Blue                    PMS 2945 C */\n  --bright-nile-blue: #2070E1; /* Bright Nile Blue                  */\n\n  /* ---------------------------------------------------------------\n     SECONDARY COLORS  (emphasis only — max 10–20% of a composition)\n     --------------------------------------------------------------- */\n  --solar-amber:   #FF6600; /* Solar Amber                          PMS 1505 C */\n  --nile-teal:     #35D39A; /* Nile Teal                            PMS 3395 C */\n  --dawn-violet:   #8758ED; /* Dawn Violet                          PMS 2725 C */\n  --nile-sky:      #8BB4EE; /* Nile Sky                             PMS 2727 C */\n  --solar-crimson: #EE4A59; /* Solar Crimson (LOGO)                 PMS 1788 C */\n  --solar-crimson-cta: #EC394C; /* Solar Crimson used in CTA + brand gradient */\n\n  /* ---------------------------------------------------------------\n     NEUTRALS\n     --------------------------------------------------------------- */\n  --nile-ink:    #001E2D; /* primary body text / dark surfaces */\n  --nile-slate:  #4D626C; /* muted / secondary text            */\n  --white:       #FFFFFF;\n  --cloud-mist:  #F6F8FB; /* light, open content surfaces      */\n\n  /* tints / shades (oklch-harmonized; for UI states only) */\n  --nile-blue-700: #0A3C87;\n  --nile-blue-100: #DCE8FB;\n  --nile-blue-050: #EEF4FE;\n  --nile-sky-100:  #CBDEFA;\n  --teal-700:      #1E8C66;\n  --teal-100:      #D6F5E9;\n  --crimson-100:   #FCE0E3;\n  --amber-100:     #FFE7D4;\n  --violet-100:    #ECE3FC;\n\n  /* legacy aliases (kept so existing files keep working) */\n  --nile-navy: var(--deep-nile-blue);\n  --nile-blue-bright: var(--bright-nile-blue);\n  --nile-orange: var(--solar-amber);\n  --nile-coral: var(--solar-crimson);\n  --nile-mint: var(--nile-teal);\n  --nile-mint-700: var(--teal-700);\n  --nile-mint-100: var(--teal-100);\n  --nile-coral-100: var(--crimson-100);\n  --nile-orange-100: var(--amber-100);\n  --nile-cloud: var(--cloud-mist);\n\n  /* ---------------------------------------------------------------\n     GRADIENTS  (use sparingly — for dynamism & brand moments)\n     --------------------------------------------------------------- */\n  /* Logo shield — Solar Amber → Solar Crimson */\n  --nile-grad-mark:        radial-gradient(circle at 30% 15%, #FF6600 30%, #EE4A59 75%);\n  --nile-grad-mark-linear: linear-gradient(135deg, #FF6600 0%, #EE4A59 100%);\n  /* CTA buttons — MUST be Solar Crimson → Solar Amber (#EC394C → #FF6600) */\n  --nile-grad-cta:         linear-gradient(135deg, #EC394C 0%, #FF6600 100%);\n  /* Brand gradient — Nile Blue + Solar Crimson + Solar Amber (tickers, dividers) */\n  --nile-grad-brand:       linear-gradient(120deg, #0E4EAF 0%, #EC394C 60%, #FF6600 100%);\n  /* Background gradients */\n  --nile-grad-blue: linear-gradient(135deg, #2070E1 0%, #0E4EAF 100%);\n  --nile-grad-ink:  linear-gradient(160deg, #072F68 0%, #001E2D 100%);\n  --nile-grad-sky:  linear-gradient(180deg, #8BB4EE 0%, #F6F8FB 100%);\n\n  /* ---------------------------------------------------------------\n     SEMANTIC TOKENS\n     --------------------------------------------------------------- */\n  --bg:          var(--white);\n  --bg-subtle:   var(--cloud-mist);\n  --bg-inset:    #EEF2F8;\n  --bg-dark:     var(--nile-ink);\n  --bg-dark-alt: var(--deep-nile-blue);\n\n  --fg1:        var(--nile-ink);    /* primary text */\n  --fg2:        var(--nile-slate);  /* secondary / muted text */\n  --fg3:        #6B8295;            /* faint captions */\n  --fg-on-dark: var(--white);\n  --fg-on-dark-2: #AFC6E6;\n\n  --accent:        var(--nile-blue);\n  --accent-hover:  var(--nile-blue-700);\n  --accent-bright: var(--bright-nile-blue);\n  --link:          var(--bright-nile-blue);\n  --link-hover:    var(--solar-amber);\n  --highlight:     var(--solar-amber);\n\n  --success: var(--nile-teal);\n  --success-fg: var(--teal-700);\n  --warning: var(--solar-amber);\n  --danger:  var(--solar-crimson);\n\n  --border:        #DCE3ED;\n  --border-strong: #C2CEDD;\n  --border-dark:   rgba(255,255,255,.14);\n\n  /* ---------------------------------------------------------------\n     TYPE  (Inter — see header)\n     --------------------------------------------------------------- */\n  --font-sans:     'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;\n  --font-editable: Arial, 'Helvetica Neue', sans-serif; /* PowerPoint / Word only */\n  --font-mono:     ui-monospace, 'SFMono-Regular', Menlo, monospace; /* utility only — not a brand face */\n\n  /* Brand hierarchy (per guidelines):\n     Headlines/subheads = Inter Semibold(600) · Body = Inter Regular(400) · CTA = Inter Bold(700) */\n  --text-xs:   0.75rem;   /* 12px */\n  --text-sm:   0.875rem;  /* 14px */\n  --text-base: 1rem;      /* 16px */\n  --text-md:   1.25rem;   /* 20px — brand body size */\n  --text-lg:   1.5rem;    /* 24px */\n  --text-xl:   1.75rem;   /* 28px */\n  --text-2xl:  2.25rem;   /* 36px — brand subheadline */\n  --text-3xl:  3rem;      /* 48px */\n  --text-4xl:  3.5rem;    /* 56px — brand headline */\n  --text-5xl:  4.5rem;    /* 72px */\n\n  --weight-reg:  400;\n  --weight-med:  500;\n  --weight-semi: 600;\n  --weight-bold: 700;\n\n  --leading-tight: 1.1;\n  --leading-snug:  1.25;\n  --leading-body:  1.55;\n  --tracking-tight: -0.02em;\n  --tracking-wide:  0.08em;\n\n  /* ---------------------------------------------------------------\n     RADII / SHADOW / SPACING / MOTION\n     --------------------------------------------------------------- */\n  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-2xl: 32px; --r-pill: 999px;\n\n  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;\n  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px; --space-9: 96px;\n\n  --shadow-xs: 0 1px 2px rgba(0,30,45,.06);\n  --shadow-sm: 0 2px 6px rgba(0,30,45,.07), 0 1px 2px rgba(0,30,45,.05);\n  --shadow-md: 0 8px 24px rgba(0,30,45,.09), 0 2px 6px rgba(0,30,45,.05);\n  --shadow-lg: 0 20px 48px rgba(0,30,45,.14), 0 6px 14px rgba(0,30,45,.07);\n  --shadow-blue: 0 14px 34px rgba(14,78,175,.28);\n  --shadow-cta: 0 12px 30px rgba(236,57,76,.30);\n  --shadow-orange: var(--shadow-cta);\n  --ring-focus: 0 0 0 3px rgba(32,112,225,.35);\n\n  --dur-fast: 120ms; --dur: 200ms; --dur-slow: 360ms;\n  --ease: cubic-bezier(.2,.7,.3,1);\n}\n\n/* =====================================================================\n   SEMANTIC ELEMENT STYLES\n   ===================================================================== */\n.nile-type, .nile-prose {\n  font-family: var(--font-sans); color: var(--fg1);\n  font-size: var(--text-base); line-height: var(--leading-body);\n  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;\n}\n\n/* Headlines & subheads = Inter Semibold */\n.h-display, .nile-prose h1 {\n  font-family: var(--font-sans); font-weight: var(--weight-semi);\n  font-size: var(--text-4xl); line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight); color: var(--fg1);\n  text-wrap: balance; margin: 0 0 .4em;\n}\n.h1, .nile-prose h2 {\n  font-weight: var(--weight-semi); font-size: var(--text-2xl);\n  line-height: var(--leading-snug); letter-spacing: var(--tracking-tight);\n  color: var(--fg1); margin: 0 0 .5em;\n}\n.h2, .nile-prose h3 {\n  font-weight: var(--weight-semi); font-size: var(--text-xl);\n  line-height: var(--leading-snug); color: var(--fg1); margin: 0 0 .5em;\n}\n.h3 { font-weight: var(--weight-semi); font-size: var(--text-lg); line-height: var(--leading-snug); color: var(--fg1); }\n\n.eyebrow { font-weight: var(--weight-bold); font-size: var(--text-sm);\n  letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--highlight); }\n.lead { font-size: var(--text-md); line-height: var(--leading-body); color: var(--fg2); }\n.nile-prose p { margin: 0 0 1em; color: var(--fg2); font-size: var(--text-md); }\nsmall, .text-sm { font-size: var(--text-sm); }\n.caption { font-size: var(--text-xs); color: var(--fg3); }\n\n/* Pull-quotes: Inter (no separate face) — Regular italic */\n.quote { font-family: var(--font-sans); font-weight: var(--weight-reg);\n  font-style: italic; font-size: var(--text-xl); line-height: 1.4; color: var(--fg1); }\n\na.nile-link { color: var(--link); text-decoration: none; }\na.nile-link:hover { color: var(--link-hover); }\n\ncode, .code { font-family: var(--font-mono); font-size: .9em; background: var(--bg-inset);\n  padding: .12em .4em; border-radius: var(--r-xs); color: var(--nile-blue); }\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: var(--bg-subtle); }\n  * { box-sizing: border-box; }\n  ::placeholder { color: var(--fg3); }\n  input:focus { outline: none; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:var(--bg-subtle); font-family:var(--font-sans); color:var(--fg1); -webkit-font-smoothing:antialiased;\">\n\n  <!-- NAVBAR -->\n  <header style=\"position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; height:64px; padding:0 32px; background:#fff; border-bottom:1px solid var(--border);\">\n    <div style=\"display:flex; align-items:center; gap:36px;\">\n      <img src=\"ea03857f-6b4c-4467-a984-8d976fab373c\" alt=\"Nile\" style=\"height:26px; display:block;\">\n      <nav style=\"display:flex; align-items:center; gap:4px;\">\n        <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ item.onClick }}\" style=\"border:none; background:{{ item.bg }}; color:{{ item.fg }}; font-family:var(--font-sans); font-size:14.5px; font-weight:{{ item.weight }}; padding:8px 14px; border-radius:var(--r-pill); cursor:pointer; transition:all var(--dur) var(--ease);\">{{ item.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:14px; position:relative;\">\n      <button style=\"position:relative; background:var(--bg-subtle); border:1px solid var(--border); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--fg2);\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.268 21a2 2 0 0 0 3.464 0\"><\u002Fpath><path d=\"M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326\"><\u002Fpath><\u002Fsvg>\n        <span style=\"position:absolute; top:9px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--nile-orange); border:2px solid #fff;\"><\u002Fspan>\n      <\u002Fbutton>\n      <button onclick=\"{{ toggleAvatar }}\" style=\"display:flex; align-items:center; gap:9px; background:none; border:none; cursor:pointer; padding:3px; border-radius:var(--r-pill);\">\n        <span style=\"width:38px; height:38px; border-radius:50%; background:var(--nile-grad-mark-linear); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;\">{{ initials }}<\u002Fspan>\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--fg3)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ avatarOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div onclick=\"{{ closeAvatar }}\" style=\"position:fixed; inset:0; z-index:45;\"><\u002Fdiv>\n        <div style=\"position:absolute; top:54px; right:0; z-index:46; width:248px; background:#fff; border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-lg); padding:8px; overflow:hidden;\">\n          <div style=\"display:flex; align-items:center; gap:11px; padding:10px 10px 12px;\">\n            <span style=\"width:40px; height:40px; border-radius:50%; background:var(--nile-grad-mark-linear); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;\">{{ initials }}<\u002Fspan>\n            <div style=\"display:flex; flex-direction:column; line-height:1.3;\">\n              <strong style=\"font-size:14px;\">{{ currentUser }}<\u002Fstrong>\n              <span style=\"font-size:12.5px; color:var(--fg3);\">{{ roleLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:1px; background:var(--border); margin:2px 0 8px;\"><\u002Fdiv>\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--fg3); padding:4px 10px 8px;\">View as<\u002Fdiv>\n          <div style=\"display:flex; gap:6px; padding:0 8px 8px;\">\n            <sc-for list=\"{{ roleOptions }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <button onclick=\"{{ r.set }}\" style=\"flex:1; border:1px solid {{ r.border }}; background:{{ r.bg }}; color:{{ r.fg }}; font-family:var(--font-sans); font-size:13px; font-weight:600; padding:8px 10px; border-radius:var(--r-sm); cursor:pointer;\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"height:1px; background:var(--border); margin:6px 0;\"><\u002Fdiv>\n          <button style=\"display:flex; align-items:center; gap:10px; width:100%; border:none; background:none; font-family:var(--font-sans); font-size:14px; font-weight:500; color:var(--fg1); padding:10px; border-radius:var(--r-sm); cursor:pointer;\" style-hover=\"background:var(--bg-subtle);\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath><path d=\"m16 17 5-5-5-5\"><\u002Fpath><path d=\"M21 12H9\"><\u002Fpath><\u002Fsvg>\n            Log out\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- CONTENT -->\n  <main style=\"max-width:1120px; margin:0 auto; padding:32px 32px 64px;\">\n\n    <div style=\"margin-bottom:24px;\">\n      <div style=\"font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--nile-blue); margin-bottom:6px;\">My Activities<\u002Fdiv>\n      <h1 style=\"margin:0 0 4px; font-size:30px; font-weight:700; letter-spacing:-.02em;\">{{ greeting }}<\u002Fh1>\n      <p style=\"margin:0; font-size:15px; color:var(--fg2);\">Here's what needs your attention across your projects and tasks.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- CARD 1: DUE -->\n    <section style=\"background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-xs); padding:22px 24px; margin-bottom:20px;\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;\">\n        <div style=\"display:flex; align-items:center; gap:12px;\">\n          <span style=\"width:38px; height:38px; border-radius:var(--r-sm); background:var(--amber-100); color:#B24400; display:flex; align-items:center; justify-content:center;\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fspan>\n          <div>\n            <h2 style=\"margin:0; font-size:17px; font-weight:700;\">Due this week &amp; past due<\u002Fh2>\n            <span style=\"font-size:13px; color:var(--fg3);\">{{ dueCountLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n ms:center; justify-content:center; font-size:10.5px; font-weight:700;\">{{ sel.ownerInitials }}<\u002Fspan>{{ sel.owner }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--fg3); margin-bottom:5px;\">Progress<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:9px;\">\n              <div style=\"flex:1; height:6px; background:var(--bg-inset); border-radius:999px; overflow:hidden;\">\n                <div style=\"height:100%; border-radius:999px; background:var(--nile-grad-blue); width: {{ sel.progress }}%;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:13px; color:var(--fg2); font-variant-numeric:tabular-nums;\">{{ sel.progressLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-bottom:22px;\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--fg3); margin-bottom:7px;\">Description<\u002Fdiv>\n          <p style=\"margin:0; font-size:14px; color:var(--fg2); line-height:1.6;\">{{ sel.desc }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--fg3); margin-bottom:11px;\">Notes<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ sel.notes }}\" as=\"note\" hint-placeholder-count=\"2\">\n              <div style=\"background:var(--bg-subtle); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px;\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px;\">\n                  <strong style=\"font-size:13px; color:var(--fg1);\">{{ note.owner }}<\u002Fstrong>\n                  <span style=\"font-size:12px; color:var(--fg3);\">{{ note.date }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0; font-size:13.5px; color:var(--fg2); line-height:1.5;\">{{ note.text }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ sel.noNotes }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:13.5px; color:var(--fg3);\">No notes yet.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px;\">\n        <button style=\"flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--nile-ink); color:#fff; border:none; font-family:var(--font-sans); font-weight:600; font-size:14px; padding:11px 16px; border-radius:var(--r-pill); cursor:pointer;\">\n          Open full task editor\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.TODAY = new Date(2026, 5, 17); // Jun 17 2026\n    this.currentUser = 'John Doe';\n    this.state = {\n      role: 'user',\n      avatarOpen: false,\n      selectedId: null,\n      dueSearch: '', duePage: 1, duePageSize: 5,\n      folSearch: '', folPage: 1, folPageSize: 5,\n    };\n    const D = (m, d) => new Date(2026, m, d);\n    this.tasks = [\n      { id:'t1', name:'Record Zero Trust demo video', status:'In Progress', progress:60, followUp:true, owner:'John Doe', initiative:'YouTube Videos', project:'Demo Videos', end:D(5,15), completed:null, desc:'Capture the screen recording and voiceover for the 4-minute Zero Trust walkthrough, then hand off to editing.', notes:[ {owner:'John Doe', date:'Jun 13', text:'Script approved by SE team. Booking the studio for Thursday.'}, {owner:'Priya Nair', date:'Jun 14', text:'Reminder to use the new lower-third template.'} ] },\n      { id:'t2', name:'Build QPR deck for Q2 2026', status:'In Progress', progress:40, followUp:false, owner:'John Doe', initiative:'QPR', project:'Q2 2026 QPR', end:D(5,18), completed:null, desc:'Assemble the quarterly business review slides for the leadership readout — pipeline, wins, and risks.' },\n      { id:'t3', name:'White Belt module 3 lab', status:'In Progress', progress:75, followUp:false, owner:'Sarah Lin', initiative:'Hands On Lab', project:'White Belt Series', end:D(5,19), completed:null, desc:'Finalize the segmentation lab guide and validate every step against the shared sandbox.' },\n      { id:'t4', name:'NPI launch checklist review', status:'Blocked', progress:20, followUp:true, owner:'Miguel Torres', initiative:'NPI', project:'Spring NPI', end:D(5,10), completed:null, desc:'Review the go-to-market launch checklist. Currently blocked on pricing sign-off from finance.', notes:[ {owner:'Miguel Torres', date:'Jun 11', text:'Pinged finance again — waiting on the approved price book.'} ] },\n      { id:'t5', name:'Roadmap stakeholder sync notes', status:'In Progress', progress:50, followUp:false, owner:'John Doe', initiative:'Roadmap', project:'H2 Planning', end:D(5,20), completed:null, desc:'Consolidate notes and decisions from the stakeholder roadmap review into the planning doc.' },\n      { id:'t6', name:'Edit SASE explainer video', status:'In Progress', progress:80, followUp:false, owner:'Priya Nair', initiative:'YouTube Videos', project:'Demo Videos', end:D(5,16), completed:null, desc:'Color-grade and cut the SASE explainer down to a tight 3 minutes for the channel.' },\n      { id:'t7', name:'Update lab VM images', status:'To Do', progress:30, followUp:false, owner:'John Doe', initiative:'Hands On Lab', project:'White Belt Series', end:D(5,21), completed:null, desc:'Refresh the base VM images to the latest Nile Portal build before the next cohort.' },\n      { id:'t8', name:'Source studio lighting kit', status:'To Do', progress:10, followUp:true, owner:'John Doe', initiative:'Operations', project:'Studio Buildout', end:D(5,25), completed:null, desc:'Get quotes for a softbox lighting kit for the recording studio. Compare two vendors.' },\n      { id:'t9', name:'Confirm QPR attendee list', status:'To Do', progress:0, followUp:true, owner:'Sarah Lin', initiative:'QPR', project:'Q2 2026 QPR', end:D(5,24), completed:null, desc:'Confirm the exec attendees and send calendar holds for the Q2 readout.' },\n      { id:'t10', name:'Follow up on demo feedback', status:'In Progress', progress:65, followUp:true, owner:'John Doe', initiative:'YouTube Videos', project:'Demo Videos', end:D(5,23), completed:null, desc:'Incorporate the review comments from the SE team on the latest demo cut.' },\n      { id:'t11', name:'Publish Zero Trust intro video', status:'Done', progress:100, followUp:false, owner:'John Doe', initiative:'YouTube Videos', project:'Demo Videos', end:D(5,16), completed:D(5,16), desc:'Published the 2-minute Zero Trust intro on the channel. Hit 1.2k views in the first day.' },\n      { id:'t12', name:'White Belt module 2 lab', status:'Done', progress:100, followUp:false, owner:'Sarah Lin', initiative:'Hands On Lab', project:'White Belt Series', end:D(5,13), completed:D(5,14), desc:'Shipped the module 2 lab guide and the accompanying knowledge-check quiz.' },\n      { id:'t13', name:'Q1 QPR retro summary', status:'Done', progress:100, followUp:false, owner:'John Doe', initiative:'QPR', project:'Q1 2026 QPR', end:D(5,12), completed:D(5,12), desc:'Wrote the Q1 retro and distributed action items to the regional leads.' },\n      { id:'t14', name:'NPI kickoff brief', status:'Done', progress:100, followUp:false, owner:'Miguel Torres', initiative:'NPI', project:'Spring NPI', end:D(5,11), completed:D(5,11), desc:'Distributed the NPI kickoff brief to the cross-functional launch team.' },\n    ];\n  }\n\n  // ---- helpers ----\n  dayDiff(a, b) { return Math.round((this.stripTime(a) - this.stripTime(b)) / 86400000); }\n  stripTime(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }\n  fmt(d) { const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return M[d.getMonth()] + ' ' + d.getDate(); }\n  initials(name) {\n    const parts = name.trim().split(/\\s+/);\n    if (parts.length === 1) return (parts[0][0] + parts[0][0]).toUpperCase();\n    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();\n  }\n  endOfWeek() {\n    const t = this.TODAY; const eow = new Date(t.getFullYear(), t.getMonth(), t.getDate());\n    eow.setDate(eow.getDate() + ((7 - eow.getDay()) % 7)); return eow;\n  }\n  visibleTasks() {\n    if (this.state.role === 'admin') return this.tasks;\n    return this.tasks.filter(t => t.owner === this.currentUser);\n  }\n  matchSearch(t, q) {\n    if (!q) return true; const s = q.toLowerCase();\n    return t.initiative.toLowerCase().includes(s) || t.project.toLowerCase().includes(s) || t.owner.toLowerCase().includes(s);\n  }\n  timingFor(t) {\n    const diff = this.dayDiff(t.end, this.TODAY); // end - today\n    if (diff < 0) return { text: (-diff) + (diff === -1 ? ' day overdue' : ' days overdue'), bg: 'var(--crimson-100)', fg: '#C42A38' };\n    if (diff === 0) return { text: 'Due today', bg: 'var(--amber-100)', fg: '#B24400' };\n    return { text: 'in ' + diff + (diff === 1 ? ' day' : ' days'), bg: 'var(--bg-inset)', fg: 'var(--fg2)' };\n  }\n  statusTone(s) {\n    if (s === 'Done') return { bg: 'var(--teal-100)', fg: 'var(--teal-700)' };\n    if (s === 'Blocked' || s === 'Delayed') return { bg: 'var(--crimson-100)', fg: '#C42A38' };\n    if (s === 'In Progress') return { bg: 'var(--nile-blue-050)', fg: 'var(--nile-blue)' };\n    return { bg: 'var(--bg-inset)', fg: 'var(--fg2)' };\n  }\n  toRow(t) {\n    const tm = this.timingFor(t);\n    return {\n      id: t.id, name: t.name, crumb: t.initiative + ' · ' + t.project,\n      dueText: this.fmt(t.end), progress: t.progress, progressLabel: t.progress + '%',\n      timingText: tm.text, timingBg: tm.bg, timingFg: tm.fg,\n      owner: t.owner, ownerInitials: this.initials(t.owner),\n      open: () => this.setState({ selectedId: t.id }),\n    };\n  }\n  paginate(list, page, size) {\n    const total = list.length;\n    const pageCount = Math.max(1, Math.ceil(total / size));\n    const eff = Math.min(page, pageCount);\n    const start = (eff - 1) * size;\n    const slice = list.slice(start, start + size);\n    const rangeLabel = total === 0 ? 'No results' : `Showing ${start + 1}–${start + slice.length} of ${total}`;\n    return { slice, total, pageCount, eff, start, rangeLabel,\n      pageLabel: `${eff} / ${pageCount}`, prevOpacity: eff <= 1 ? '0.4' : '1', nextOpacity: eff >= pageCount ? '0.4' : '1' };\n  }\n  pageSizeBtns(current, setter) {\n    return [5, 10, 25].map(n => ({\n      n, set: () => setter(n),\n      active: current === n,\n      bg: current === n ? 'var(--nile-blue)' : '#fff',\n      fg: current === n ? '#fff' : 'var(--fg2)',\n      border: current === n ? 'var(--nile-blue)' : 'var(--border)',\n    }));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const vis = this.visibleTasks();\n    const eow = this.endOfWeek();\n\n    // Card 1: due this week or past due (not done)\n    const dueAll = vis.filter(t => t.status !== 'Done' && this.dayDiff(t.end, eow) <= 0)\n      .filter(t => this.matchSearch(t, st.dueSearch))\n      .sort((a, b) => a.end - b.end);\n    const duePg = this.paginate(dueAll, st.duePage, st.duePageSize);\n    const dueRows = duePg.slice.map(t => this.toRow(t));\n\n    // Card 2: follow-ups (not done + followUp)\n    const folAll = vis.filter(t => t.status !== 'Done' && t.followUp)\n      .filter(t => this.matchSearch(t, st.folSearch))\n      .sort((a, b) => a.end - b.end);\n    const folPg = this.paginate(folAll, st.folPage, st.folPageSize);\n    const folRows = folPg.slice.map(t => this.toRow(t));\n\n    // Timeline: completed in the past 7 days\n    const timeline = vis.filter(t => t.status === 'Done' && t.completed && this.dayDiff(this.TODAY, t.completed) >= 0 && this.dayDiff(this.TODAY, t.completed) <= 7)\n      .sort((a, b) => b.completed - a.completed)\n      .map(t => ({ name: t.name, initiative: t.initiative, project: t.project, completedText: 'Completed ' + this.fmt(t.completed), desc: t.desc, owner: t.owner, ownerInitials: this.initials(t.owner) }));\n\n    // Drawer\n    const selTask = this.tasks.find(t => t.id === st.selectedId);\n    let sel = null;\n    if (selTask) {\n      const stn = this.statusTone(selTask.status);\n      sel = {\n        name: selTask.name, crumb: selTask.initiative + ' · ' + selTask.project,\n        status: selTask.status, statusBg: stn.bg, statusFg: stn.fg,\n        dueText: this.fmt(selTask.end), owner: selTask.owner, ownerInitials: this.initials(selTask.owner),\n        progress: selTask.progress, progressLabel: selTask.progress + '%', desc: selTask.desc,\n        notes: selTask.notes || [], noNotes: !selTask.notes || selTask.notes.length === 0,\n      };\n    }\n\n    const navLabels = ['My Activities', 'Dashboard', 'Initiatives', 'Projects', 'Tasks'];\n    const navItems = navLabels.map(l => ({\n      label: l, onClick: () => {}, bg: l === 'My Activities' ? 'var(--nile-blue-050)' : 'transparent',\n      fg: l === 'My Activities' ? 'var(--nile-blue)' : 'var(--fg2)',\n      weight: l === 'My Activities' ? 600 : 500,\n    }));\n\n    const roleOptions = [\n      { key: 'user', label: 'User' },\n      { key: 'admin', label: 'Administrator' },\n    ].map(r => ({\n      label: r.label, set: () => this.setState({ role: r.key, duePage: 1, folPage: 1 }),\n      bg: st.role === r.key ? 'var(--nile-blue)' : '#fff',\n      fg: st.role === r.key ? '#fff' : 'var(--fg2)',\n      border: st.role === r.key ? 'var(--nile-blue)' : 'var(--border)',\n    }));\n\n    const hour = 9;\n    const greeting = (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + ', ' + this.currentUser.split(' ')[0];\n\n    return {\n      // nav / user\n      navItems, initials: this.initials(this.currentUser), currentUser: this.currentUser,\n      roleLabel: st.role === 'admin' ? 'Administrator' : 'User',\n      avatarOpen: st.avatarOpen, toggleAvatar: () => this.setState({ avatarOpen: !st.avatarOpen }),\n      closeAvatar: () => this.setState({ avatarOpen: false }), roleOptions,\n      greeting, showOwner: st.role === 'admin',\n\n      // due card\n      dueRows, dueEmpty: dueRows.length === 0, dueRangeLabel: duePg.rangeLabel,\n      dueCountLabel: dueAll.length + (dueAll.length === 1 ? ' task needs attention' : ' tasks need attention'),\n      duePageLabel: duePg.pageLabel, duePrevOpacity: duePg.prevOpacity, dueNextOpacity: duePg.nextOpacity,\n      duePageSizes: this.pageSizeBtns(st.duePageSize, n => this.setState({ duePageSize: n, duePage: 1 })),\n      onDueSearch: (e) => this.setState({ dueSearch: e.target.value, duePage: 1 }),\n      duePrev: () => this.setState(s => ({ duePage: Math.max(1, s.duePage - 1) })),\n      dueNext: () => this.setState(s => ({ duePage: Math.min(duePg.pageCount, s.duePage + 1) })),\n\n      // follow card\n      folRows, folEmpty: folRows.length === 0, folRangeLabel: folPg.rangeLabel,\n      folCountLabel: folAll.length + (folAll.length === 1 ? ' open follow-up' : ' open follow-ups'),\n      folPageLabel: folPg.pageLabel, folPrevOpacity: folPg.prevOpacity, folNextOpacity: folPg.nextOpacity,\n      folPageSizes: this.pageSizeBtns(st.folPageSize, n => this.setState({ folPageSize: n, folPage: 1 })),\n      onFolSearch: (e) => this.setState({ folSearch: e.target.value, folPage: 1 }),\n      folPrev: () => this.setState(s => ({ folPage: Math.max(1, s.folPage - 1) })),\n      folNext: () => this.setState(s => ({ folPage: Math.min(folPg.pageCount, s.folPage + 1) })),\n\n      // timeline\n      timeline, timelineEmpty: timeline.length === 0,\n      timelineCountLabel: timeline.length + (timeline.length === 1 ? ' task wrapped up' : ' tasks wrapped up'),\n\n      // drawer\n      drawerOpen: !!sel, sel: sel || {}, closeDrawer: () => this.setState({ selectedId: null }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
